<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CommuteWeather" />
  <title>Commuter Weather</title>

  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./images/favicon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/app.css" />

  <!-- Native Browser ES Module Import Map (Preact 10 + HTM 3) -->
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.25.4",
        "preact/hooks": "https://esm.sh/preact@10.25.4/hooks",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- Initial lightweight loading skeleton shown before JS mounts -->
    <div class="initial-loader">
      <div class="spinner"></div>
      <p>Loading Commuter Weather...</p>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Service worker registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
