name: Test and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - modernize-noaa-zerobuild
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployment runs
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 1. Run Automated Unit Tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unit Tests (NOAA Client, Decision Engine, Solar Math)
        run: node --test tests/*.test.js

  # 2. Deploy to GitHub Pages upon passing tests (master branch only)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '.'

      - name: Allow Pages artifact registration
        run: sleep 15

      - name: Wait for Pages artifact availability
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;

            for (let attempt = 0; attempt < 10; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });

              if (data.artifacts.some((artifact) => artifact.name === artifactName && !artifact.expired)) {
                return;
              }

              if (attempt < 9) {
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
            }

            throw new Error(`Pages artifact "${artifactName}" was not visible after 10 checks.`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
